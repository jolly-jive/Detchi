# Build the container image for amd64 and arm64, and push it to Docker Hub,
# when a release tag (v0.1.0 and so on) is pushed.
#
# Needs the repository secrets DOCKERHUB_USER (the Docker Hub user) and
# DOCKERHUB_TOKEN (an access token of that user, Read & Write).
#
# Actions are pinned to commit SHAs, since this workflow holds the token.

name: Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: cayenneryo/detchi

jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag must name the version in mix.exs: detchi --version and the
      # start lines of the records show that one, not the tag.
      - name: Check the tag against mix.exs
        run: |
          version=$(sed -n 's/^ *version: "\(.*\)",$/\1/p' mix.exs)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in mix.exs"
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 0.1.0 and 0.1, and latest; a pre-release (v0.2.0-rc.1) gets
          # only its own tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      # QEMU runs only the run stage of arm64 (apk add); the escript is
      # built once, natively (see the Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
